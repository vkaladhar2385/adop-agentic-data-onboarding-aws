# ADOP — Deploy (artifacts + IaC promotion)
# Dev agents only GENERATE artifacts; promotion to QA/Staging/Prod happens here,
# through standard CI/CD with human approval gates — never by the agent itself.
# Workloads are discovered from iac/terraform/*.tf (main.tf + workloads_{name}.tf).
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: target environment
        type: choice
        options: [qa, staging, prod]
        default: qa

permissions:
  id-token: write        # OIDC federation to AWS (no long-lived keys)
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  package_and_sync:
    name: package lambdas + sync scripts to artifact bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, least-privilege role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/adop-deploy-${{ github.event.inputs.environment }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover workloads with a Terraform module
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          names = set()
          for tf in Path("iac/terraform").glob("*.tf"):
              text = tf.read_text(encoding="utf-8")
              for name in re.findall(r'module\s+"([^"]+)"\s*\{', text):
                  if (Path("workloads") / name).is_dir():
                      names.add(name)
          ordered = " ".join(sorted(names))
          print(f"Discovered TF workloads: {ordered}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"TF_WORKLOADS={ordered}\n")
          PY

      - name: Package + sync each discovered workload
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          for w in $TF_WORKLOADS; do
            python tools/package_and_sync.py --bucket "${{ secrets.ARTIFACT_BUCKET }}" --workload "$w"
          done

  terraform_apply:
    name: terraform apply (discovered workloads)
    runs-on: ubuntu-latest
    needs: package_and_sync
    environment: ${{ github.event.inputs.environment }}   # GitHub env = approval gate
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, least-privilege role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/adop-deploy-${{ github.event.inputs.environment }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform apply (state machines, schedules, KMS, IAM, Glue jobs, Lambdas)
        working-directory: iac/terraform
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="data_lake_bucket=${{ secrets.DATA_LAKE_BUCKET }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="environment=${{ github.event.inputs.environment }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover workloads with a Terraform module
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          names = set()
          for tf in Path("iac/terraform").glob("*.tf"):
              text = tf.read_text(encoding="utf-8")
              for name in re.findall(r'module\s+"([^"]+)"\s*\{', text):
                  if (Path("workloads") / name).is_dir():
                      names.add(name)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"TF_WORKLOADS={' '.join(sorted(names))}\n")
          PY

      - name: Post-deployment verification (mandatory, must pass)
        run: |
          python -m pip install boto3
          for w in $TF_WORKLOADS; do
            if [ -f "workloads/$w/orchestration/${w}_state_machine.json" ]; then
              python shared/utils/post_deployment_verifier.py \
                --workload "$w" \
                --database "${w}_db" \
                --state-machine "${w}_pipeline"
            else
              echo "Skip SFN verifier for $w (no state machine artifact)"
            fi
          done
