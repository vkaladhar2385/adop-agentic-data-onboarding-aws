workload: customer_orders

bronze_to_silver:
  dedup:
    keys: [order_id]
    keep: latest_by
    order_by: updated_at
    retain_blank_keys: true
  casts:
    quantity: integer
    order_total: decimal
    order_date: date
    updated_at: timestamp
  string_ops:
    trim: all
    uppercase: [order_status]
  pii_masking:
    - column: customer_id
      strategy: hash_token
  quarantine_when:
    - missing_order_id
    - invalid_quantity
  quarantine_rules:
    - id: missing_order_id
      type: blank
      column: order_id
    - id: invalid_quantity
      type: range
      column: quantity
      min: 1
      null_is_invalid: true
  derived:
    line_value: "order_total"

silver_to_gold:
  schema_style: flat
  table: gold_customer_orders
  grain: order_id
  measures: [quantity, order_total, line_value]
  gold_pii_policy:
    suppress: [customer_id]
