workload: customer_orders
orchestrator: mwaa
ontology_staging: true

schedule:
  engine: mwaa
  cron: "0 7 * * *"
  timezone: UTC
  catchup: false
  max_active_runs: 1

execution:
  dag_id: customer_orders_pipeline
  retries: 2
  timeout_minutes: 90

failure_handling:
  on_failure: notify
  sns_topic: customer-orders-alerts

dependencies: []
