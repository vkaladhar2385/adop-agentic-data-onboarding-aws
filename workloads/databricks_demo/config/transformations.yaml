workload: databricks_demo

bronze_to_silver:
  dedup:
    keys: [supplier_id, product_category]
    keep: latest_by
    order_by: updated_at
    retain_blank_keys: true
  casts:
    lead_time_days: integer
    min_order_qty: integer
    updated_at: timestamp
    effective_date: date
    is_preferred: boolean
  string_ops:
    trim: all
    uppercase: [product_category, country_code]
  pii_masking: []
  quarantine_when:
    - missing_supplier_id
    - invalid_lead_time
  quarantine_rules:
    - id: missing_supplier_id
      type: blank
      column: supplier_id
    - id: invalid_lead_time
      type: range
      column: lead_time_days
      min: 0
      max: 365
      null_is_invalid: true
  derived:
    lead_time_weeks: "lead_time_days / 7.0"

silver_to_gold:
  schema_style: flat
  table: gold_databricks_demo
  grain: supplier_id, product_category
  measures: [lead_time_days, min_order_qty, lead_time_weeks]
  gold_pii_policy:
    suppress: []
