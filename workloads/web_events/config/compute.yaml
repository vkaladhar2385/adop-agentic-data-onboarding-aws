# Generated by: Metadata / DevOps Agent | template: compute.v1
# Target routing for web_events (Terraform module still PILOT-DISABLED).
workload: web_events

profile:
  estimated_rows_per_run: 240
  peak_rows_per_run: 5000
  silver_format: iceberg
  gold_format: iceberg
  compliance: GDPR

defaults:
  transform_job_type: glueetl
  quality_job_type: pythonshell
  ingest_job_type: auto

pipeline_steps:
  ingest_to_bronze:
    job_type: pythonshell
    script: scripts/extract/ingest_to_bronze.py
    rationale: hourly JSONL demo volume; Shell copy, no Spark

  bronze_to_silver:
    job_type: glueetl
    script: scripts/transform/bronze_to_silver.py
    workers: 2
    worker_type: G.1X
    requires:
      - datalake-formats=iceberg
      - enable-data-lineage=true

  quality_silver:
    job_type: pythonshell
    script: scripts/quality/run_quality_checks.py

  silver_to_gold:
    job_type: glueetl
    script: scripts/transform/silver_to_gold.py
    workers: 2
    worker_type: G.1X
    requires:
      - datalake-formats=iceberg
      - enable-data-lineage=true

  quality_gold:
    job_type: pythonshell
    script: scripts/quality/run_quality_checks.py

terraform_sync:
  status: pending
  note: module "web_events" is commented out in main.tf (PILOT-DISABLED).

# MCP-first data plane. Terraform module still PILOT-DISABLED.
infrastructure:
  catalog:
    owner: mcp
    database: web_events_db
  kms:
    owner: mcp
    zones: [bronze, silver, gold]
  iam:
    owner: mcp
  lakeformation:
    owner: mcp
  glue_jobs:
    owner: terraform
  orchestration:
    owner: terraform

catalog:
  owner: mcp
  database: web_events_db

sinks:
  redshift: false
  opensearch: false
  redis: false

routing:
  rules:
    - id: iceberg_transform_requires_spark
      when: "step in (bronze_to_silver, silver_to_gold) and zone_format in (iceberg,)"
      job_type: glueetl
      override: true
    - id: quality_gate_prefers_shell
      when: "step matches quality_*"
      job_type: pythonshell
    - id: demo_scale_ingest
      when: "step == ingest_to_bronze and peak_rows_per_run <= 50000"
      job_type: pythonshell
