workload: web_events

schedule:
  engine: eventbridge_scheduler
  cron: "cron(5 * * * ? *)"       # :05 past each hour — micro-batch
  timezone: UTC
  flexible_time_window: "OFF"

execution:
  state_machine: web_events_pipeline
  retries: 3
  backoff: exponential
  timeout_minutes: 30

failure_handling:
  on_failure: notify
  sns_topic: web-events-alerts
  right_to_erasure_queue: web-events-erasure
