# Generated by: Metadata Agent | workload: web_events
# Contrasts with advisory_transactions: micro-batch clickstream + GDPR (not SOX).
workload: web_events
domain: digital_analytics
description: >-
  Website clickstream landed as JSON Lines (simulating a Kinesis buffer flush).
  GDPR: consent filter, hashed user_id, masked IP, 365-day retention,
  right-to-erasure hook.

source:
  type: kinesis_landing          # demo: JSONL file that a stream would flush to S3
  format: jsonl
  location: s3://data-lake-<account>-us-east-1/landing/web_events/ingestion_hour=YYYY-MM-DD-HH/events.jsonl
  primary_key: event_id
  estimated_row_count: 240

cadence:
  mode: micro_batch
  frequency: hourly
  time_utc: "at :05 past each hour"

zones:
  bronze:
    database: web_events_db
    table: bronze_web_events
    format: json
  silver:
    database: web_events_db
    table: silver_web_events
    format: iceberg
  gold:
    database: web_events_db
    schema_style: rollup         # hourly metrics, not a star schema
    format: iceberg

compliance:
  regulation: GDPR
  retention_days: 365
  bronze_immutable: true
  right_to_erasure: true         # erase hook keyed by hashed user_id

orchestration:
  engine: step_functions
  schedule: eventbridge_scheduler
