# AWS medallion + Snowflake Mode A Gold sink (Phase 7.4).
profile: aws
host_cloud: aws

storage:
  lake_format: iceberg
  object_store: s3

capabilities:
  transform_engine: spark
  batch_python: true
  catalog:
    kind: glue
    database: snowflake_sink_demo_db
  governance:
    pii_tags: true
    kind: lakeformation
  orchestrator:
    type: step_functions

deploy_adapter: terraform
