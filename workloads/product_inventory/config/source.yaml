# Workload: product_inventory
workload: product_inventory
domain: catalog
description: >-
  Daily product/SKU inventory snapshot. One CSV lands per day and is ingested
  immutably to Bronze. Catalog-only medallion (no extension sinks).

source:
  type: s3
  format: csv
  has_header: true
  location: s3://data-lake-<account>-us-east-1/landing/product_inventory/ingestion_date=YYYY-MM-DD/product_inventory.csv
  compression: none
  primary_key: sku
  estimated_row_count: 200

cadence:
  mode: batch
  frequency: daily
  time_utc: "08:00"

zones:
  bronze:
    database: product_inventory_db
    table: bronze_product_inventory
    format: parquet
  silver:
    database: product_inventory_db
    table: silver_product_inventory
    format: iceberg
  gold:
    database: product_inventory_db
    table: gold_product_inventory
    schema_style: flat
    format: iceberg

compliance:
  regulation: none
  retention_years: 2
  bronze_immutable: true

orchestration:
  engine: step_functions
  schedule: eventbridge_scheduler
