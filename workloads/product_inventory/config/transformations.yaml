# Generated by: Transformation Agent (Phase 4b)  |  template: transformations.v1
workload: product_inventory

bronze_to_silver:
  dedup:
    keys: [sku]
    keep: latest_by
    order_by: updated_at
  casts:
    on_hand_qty: integer
    reserved_qty: integer
    unit_cost: decimal
    list_price: decimal
    updated_at: timestamp
  string_ops:
    trim: all
    uppercase: [category, status, warehouse_id]
  pii_masking: []
  quarantine_when:
    - missing_sku
    - negative_on_hand
  derived:
    available_qty: "on_hand_qty - reserved_qty"
    inventory_value: "on_hand_qty * unit_cost"
    margin_pct: "(list_price - unit_cost) / list_price"

silver_to_gold:
  schema_style: flat
  table: gold_product_inventory
  grain: sku
  measures: [on_hand_qty, reserved_qty, available_qty, unit_cost, list_price, inventory_value, margin_pct]
  gold_pii_policy:
    suppress: []
