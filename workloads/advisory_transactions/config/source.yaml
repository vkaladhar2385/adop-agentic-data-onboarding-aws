# Generated by: Metadata Agent (Phase 4a)  |  template: source.v1
# Workload: advisory_transactions
# Describes WHERE the data comes from and HOW often it lands.
workload: advisory_transactions
domain: wealth_management
description: >-
  Daily brokerage / advisory transaction feed for a wealth-management firm.
  One CSV file lands in S3 per business day and is ingested immutably to Bronze.

source:
  type: s3
  format: csv
  has_header: true
  # Partitioned landing path; {ingestion_date} is filled by the scheduler.
  location: s3://data-lake-<account>-us-east-1/landing/advisory_transactions/ingestion_date=YYYY-MM-DD/advisory_transactions.csv
  compression: none
  primary_key: transaction_id
  estimated_row_count: 200          # per daily file (demo scale)

cadence:
  mode: batch
  frequency: daily
  time_utc: "07:00"                 # after overnight custodial feed settles

zones:
  bronze:
    database: advisory_transactions_db
    table: bronze_advisory_transactions
    format: parquet                 # raw, immutable snapshot of source
  silver:
    database: advisory_transactions_db
    table: silver_advisory_transactions
    format: iceberg
  gold:
    database: advisory_transactions_db
    schema_style: star              # fact + dimensions for BI/reporting
    format: iceberg

compliance:
  regulation: SOX
  retention_years: 7
  bronze_immutable: true

orchestration:
  engine: step_functions            # per sandbox cost guardrails (no MWAA)
  schedule: eventbridge_scheduler
