# Generated by: Metadata / DevOps Agent | template: compute.v1 (draft)
# Declarative Glue compute routing for this workload.
# Agents and Terraform MUST derive aws_glue_job.job_type from this file — not guess.
#
# job_type values:
#   glueetl     — Glue 4.0 PySpark (G.1X workers); required for Iceberg transforms
#   pythonshell — Glue Python Shell 0.0625 DPU; light I/O, scoring, demo-scale ingest
#
# Pilot note: Terraform still deploys all-pythonshell until migration lands.
# This file declares the TARGET routing per AGENTS.md compute rules.

workload: advisory_transactions

# Phase 1 inputs that drive routing (human-provided or profiled)
profile:
  estimated_rows_per_run: 200          # daily file — demo scale
  peak_rows_per_run: 5000              # upper bound for capacity planning
  silver_format: iceberg
  gold_format: iceberg
  compliance: SOX

# Default when a step omits job_type (prefer explicit per-step entries)
defaults:
  transform_job_type: glueetl          # bronze→silver, silver→gold
  quality_job_type: pythonshell        # scoring / gate sidecars
  ingest_job_type: auto                # resolved by routing.rules below

# Per pipeline step — source of truth for Terraform glue_jobs map
pipeline_steps:
  ingest_to_bronze:
    job_type: pythonshell              # demo CSV copy; flip to glueetl when volume or parsing grows
    script: scripts/extract/ingest_to_bronze.py
    rationale: sub-5k rows/day, single CSV, no Spark shuffle benefit

  bronze_to_silver:
    job_type: glueetl                  # Iceberg Silver write requires Spark
    script: scripts/transform/bronze_to_silver.py
    workers: 2
    worker_type: G.1X
    requires:
      - datalake-formats=iceberg
      - enable-data-lineage=true

  quality_silver:
    job_type: pythonshell
    script: scripts/quality/run_quality_checks.py
    rationale: reads quality sidecar / Athena sample; no distributed transform

  silver_to_gold:
    job_type: glueetl
    script: scripts/transform/silver_to_gold.py
    workers: 2
    worker_type: G.1X
    requires:
      - datalake-formats=iceberg
      - enable-data-lineage=true

  quality_gold:
    job_type: pythonshell
    script: scripts/quality/run_quality_checks.py

# Automatic resolution when ingest_job_type: auto or step omits job_type
routing:
  rules:
    - id: iceberg_transform_requires_spark
      when: "step in (bronze_to_silver, silver_to_gold) and zone_format in (iceberg,)"
      job_type: glueetl
      override: true                   # cannot be downgraded to pythonshell

    - id: quality_gate_prefers_shell
      when: "step matches quality_*"
      job_type: pythonshell

    - id: large_volume_ingest
      when: "step == ingest_to_bronze and peak_rows_per_run > 50000"
      job_type: glueetl

    - id: demo_scale_ingest
      when: "step == ingest_to_bronze and peak_rows_per_run <= 50000"
      job_type: pythonshell
