# Generated by: Quality Agent (Phase 4c)  |  template: quality_rules.v1
# SOX gates: Silver >= 0.80, Gold >= 0.95. Any critical rule failure blocks
# promotion regardless of the overall score (ADOP `quality-gates` invariant).
workload: advisory_transactions

gates:
  silver: 0.80
  gold: 0.95

rules:
  # completeness
  - id: completeness_transaction_id
    dimension: completeness
    critical: true
    threshold: 1.00
    description: transaction_id must never be null (primary key)
  - id: completeness_account_id
    dimension: completeness
    critical: false
    threshold: 0.98
    description: account_id present
  - id: completeness_net_amount
    dimension: completeness
    critical: false
    threshold: 0.98
    description: net_amount present

  # uniqueness
  - id: uniqueness_transaction_id
    dimension: uniqueness
    critical: true
    threshold: 1.00
    description: transaction_id unique after dedup

  # validity
  - id: validity_trade_date
    dimension: validity
    critical: true
    threshold: 1.00
    description: trade_date is a real YYYY-MM-DD date
  - id: validity_trade_before_settle
    dimension: validity
    critical: false
    threshold: 0.98
    description: trade_date <= settlement_date (T+2)
  - id: validity_quantity_non_negative
    dimension: validity
    critical: true
    threshold: 1.00
    description: quantity >= 0
  - id: validity_unit_price_non_negative
    dimension: validity
    critical: false
    threshold: 1.00
    description: unit_price >= 0
  - id: validity_transaction_type
    dimension: validity
    critical: false
    threshold: 0.99
    description: transaction_type in BUY/SELL/DIVIDEND/FEE
  - id: validity_currency
    dimension: validity
    critical: false
    threshold: 1.00
    description: currency in [USD]

  # accuracy + consistency (SOX financial integrity)
  - id: accuracy_gross_amount
    dimension: accuracy
    critical: true
    threshold: 1.00
    description: gross_amount == quantity * unit_price (+/- 0.01)
  - id: consistency_net_amount
    dimension: consistency
    critical: true
    threshold: 1.00
    description: net_amount == gross_amount - commission - fees (+/- 0.01)
