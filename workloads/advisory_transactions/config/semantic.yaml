# Generated by: Metadata Agent (Phase 4a)  |  template: semantic.v1
# Business context / column roles. Source of truth for the Semantic Layer
# (mirrored to SageMaker Catalog; OWL + R2RML induced from this at deploy).
workload: advisory_transactions
namespace: wealth

entities:
  - name: Transaction
    grain: one row per executed brokerage/advisory transaction
    primary_key: transaction_id

columns:
  transaction_id:   { role: identifier, type: string,  pii: false }
  account_id:       { role: dimension,  type: string,  pii: false, fk: Account }
  advisor_id:       { role: dimension,  type: string,  pii: false, fk: Advisor }
  client_id:        { role: dimension,  type: string,  pii: false, note: pseudonymised via hash_token }
  client_name:      { role: attribute,  type: string,  pii: true,  pii_type: NAME,  sensitivity: HIGH }
  client_email:     { role: attribute,  type: string,  pii: true,  pii_type: EMAIL, sensitivity: HIGH }
  client_ssn:       { role: attribute,  type: string,  pii: true,  pii_type: SSN,   sensitivity: CRITICAL }
  security_id:      { role: dimension,  type: string,  pii: false, fk: Security }
  security_name:    { role: attribute,  type: string,  pii: false }
  asset_class:      { role: dimension,  type: string,  pii: false }
  transaction_type: { role: dimension,  type: string,  pii: false }
  trade_date:       { role: temporal,   type: date,    pii: false }
  settlement_date:  { role: temporal,   type: date,    pii: false }
  quantity:         { role: measure,    type: decimal, pii: false }
  unit_price:       { role: measure,    type: decimal, pii: false }
  gross_amount:     { role: measure,    type: decimal, pii: false }
  commission:       { role: measure,    type: decimal, pii: false }
  fees:             { role: measure,    type: decimal, pii: false }
  net_amount:       { role: measure,    type: decimal, pii: false }
  currency:         { role: dimension,  type: string,  pii: false }
  account_type:     { role: dimension,  type: string,  pii: false }
  advisor_name:     { role: attribute,  type: string,  pii: false }
  branch_code:      { role: dimension,  type: string,  pii: false }

hierarchies:
  - name: org
    levels: [branch_code, advisor_id, account_id]

relationships:
  - from: Transaction.account_id  -> Account.account_id     # many-to-one
  - from: Transaction.advisor_id  -> Advisor.advisor_id     # many-to-one
  - from: Transaction.security_id -> Security.security_id   # many-to-one

business_terms:
  net_amount: "Cash impact of the transaction after commission and fees."
  gross_amount: "Notional value = quantity x unit_price before costs."
