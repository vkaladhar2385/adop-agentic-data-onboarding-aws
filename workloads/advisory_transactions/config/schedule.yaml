# Generated by: Orchestration Agent (Phase 4d)  |  template: schedule.v1
# Targets Step Functions + EventBridge Scheduler (NOT MWAA) to avoid the
# always-on ~$350/mo Airflow cost. The DAG-equivalent is the ASL state machine
# in orchestration/advisory_transactions_state_machine.json.
workload: advisory_transactions

schedule:
  engine: eventbridge_scheduler
  cron: "cron(0 7 * * ? *)"          # 07:00 UTC daily
  timezone: UTC
  flexible_time_window: "OFF"

execution:
  state_machine: advisory_transactions_pipeline
  retries: 3
  backoff: exponential
  backoff_rate: 2.0
  interval_seconds: 30
  timeout_minutes: 60

failure_handling:
  on_failure: notify
  sns_topic: advisory-transactions-alerts
  quarantine_review_required: true    # SOX: bad financial rows need human sign-off

dependencies: []                      # standalone workload
