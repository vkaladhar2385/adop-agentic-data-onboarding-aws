# Generated by: Transformation Agent (Phase 4b)  |  template: transformations.v1
# Declarative cleaning + shaping rules. The PySpark (Glue) job and the local
# pandas runner both read this file, so prod and local behaviour cannot drift.
workload: advisory_transactions

bronze_to_silver:
  dedup:
    keys: [transaction_id]
    keep: latest_by
    order_by: ingestion_date
  casts:
    trade_date: date
    settlement_date: date
    quantity: decimal
    unit_price: decimal
    gross_amount: decimal
    commission: decimal
    fees: decimal
    net_amount: decimal
  string_ops:
    trim: all
    uppercase: [currency, transaction_type, asset_class, account_type]
  pii_masking:                       # SOX + PII: mask in Silver, never log raw
    - column: client_ssn
      strategy: mask_ssn             # ***-**-6789
    - column: client_email
      strategy: mask_email           # j***@example.com
    - column: client_id
      strategy: hash_token           # join-safe pseudonym
  quarantine_when:                   # rows failing critical validity are set aside, not dropped silently
    - invalid_trade_date
    - negative_quantity
    - broken_gross_formula
    - broken_net_formula
    - missing_net_amount
  derived:
    trade_year: "year(trade_date)"
    trade_month: "month(trade_date)"

silver_to_gold:
  schema_style: star
  fact:
    name: fact_transactions
    grain: transaction_id
    measures: [quantity, unit_price, gross_amount, commission, fees, net_amount]
    foreign_keys: [account_id, advisor_id, security_id, trade_date]
  dimensions:
    - name: dim_account
      key: account_id
      attributes: [account_type, branch_code, client_id]     # client_id already pseudonymised
    - name: dim_advisor
      key: advisor_id
      attributes: [advisor_name, branch_code]
    - name: dim_security
      key: security_id
      attributes: [security_name, asset_class]
    - name: dim_date
      key: trade_date
      attributes: [trade_year, trade_month]
  gold_pii_policy:
    suppress: [client_ssn, client_email, client_name]   # dropped entirely from Gold
  analytical_view:
    name: gold_advisor_daily_summary
    group_by: [advisor_id, trade_date]
    aggregations:
      total_net_amount: sum(net_amount)
      total_commission: sum(commission)
      transaction_count: count(transaction_id)
