    iam_policy: config/agentcore/iam/s3-tables-policy.json

  - name: pii-detection
    required: false
    description: PII scan and LF tag hints
    lambda:
      source: mcp-servers/pii-detection-server/lambda_handler.py
      handler: lambda_handler.handler
      runtime: python3.12
      timeout: 300
