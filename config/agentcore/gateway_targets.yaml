# AgentCore Gateway targets — Mode B (laptop agent + cloud MCP tools).
# Register with: python tools/deploy_mcp_gateway.py
# All 13 registry servers have Lambda targets; use switch_mcp_mode for local vs Gateway.

gateway:
  name_suffix: mcp-gateway
  description: ADOP Track B MCP Gateway (13 targets)

targets:
  - name: glue-athena
    required: true
    description: Glue catalog and Athena queries
    lambda:
      source: mcp-servers/glue-athena-server/lambda_handler.py
      handler: lambda_handler.handler
      runtime: python3.12
      timeout: 300
      memory: 256
    schema: config/agentcore/schemas/glue-athena-tools.json
    iam_policy: config/agentcore/iam/glue-athena-policy.json

  - name: lakeformation
    required: true
    description: LF-Tags, TBAC grants, column-level security
    lambda:
      source: mcp-servers/lakeformation-server/lambda_handler.py
      handler: lambda_handler.handler
      runtime: python3.12
      timeout: 300
      memory: 256
    schema: config/agentcore/schemas/lakeformation-tools.json
    iam_policy: config/agentcore/iam/lakeformation-policy.json

  - name: iam
    required: true
    description: IAM role lookup and policy simulation
    lambda:
      source: mcp-servers/gateway-lambdas/iam/lambda_handler.py
      handler: lambda_handler.handler
      runtime: python3.12
      timeout: 120
      memory: 256
    schema: config/agentcore/schemas/iam-tools.json
    iam_policy: config/agentcore/iam/iam-policy.json

  - name: cloudtrail
    required: false
    description: CloudTrail event lookup
    lambda:
      source: mcp-servers/gateway-lambdas/cloudtrail/lambda_handler.py
      handler: lambda_handler.handler
      runtime: python3.12
      timeout: 120
      memory: 256
    schema: config/agentcore/schemas/cloudtrail-tools.json
    iam_policy: config/agentcore/iam/cloudtrail-policy.json

  - name: redshift
    required: false
    description: Redshift Data API queries
    lambda:
      source: mcp-servers/gateway-lambdas/redshift/lambda_handler.py
